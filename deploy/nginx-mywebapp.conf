server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/mywebapp_access.log;
    error_log  /var/log/nginx/mywebapp_error.log;

    location = / {
        proxy_pass http://127.0.0.1:5200;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/notes(/[0-9]+)?/?$ {
        proxy_pass http://127.0.0.1:5200;
        include /etc/nginx/proxy_params;
    }

    location / {
        return 404;
    }
}